<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>VocabularyApp</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        form { margin-top: 20px; display: flex; gap: 8px; }
        input, select { padding: 6px; }
    </style>
</head>
<body>
    <h1>VocabularyApp</h1>

    <form id="vokabel-form">
        <input type="text" id="wort" placeholder="Wort" required>
        <select id="genus">
            <option value="der">der</option>
            <option value="die">die</option>
            <option value="das">das</option>
        </select>
        <input type="text" id="uebersetzung" placeholder="Übersetzung" required>
        <button type="submit">Hinzufügen</button>
    </form>

    <table>
        <thead>
           <tr><th>Wort</th><th>Genus</th><th>Übersetzung</th><th></th></tr>
        </thead>
        <tbody id="vokabel-liste"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
